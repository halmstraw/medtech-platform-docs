name: Deploy Docs to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      # ── Build MkDocs/Zensical docs site ───────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build docs
        run: |
          pip install zensical
          zensical build --clean

      # ── Build AOE Tech Radar ───────────────────────────────────────────────
      # The AOE radar source is cloned at a pinned release. Our customised
      # data lives in radar/data/ — it is overlaid onto the cloned source
      # before building. Only radar/data/ is committed to this repo.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Clone AOE Tech Radar source (v4.6.1)
        run: git clone --depth 1 --branch v4.6.1 https://github.com/AOEpeople/aoe_technology_radar.git /tmp/aoe_radar
      - name: Overlay our radar data
        run: cp -r radar/data/. /tmp/aoe_radar/data/
      - name: Install radar dependencies
        run: npm ci
        working-directory: /tmp/aoe_radar
      # v4.6.1 build script is just `next build` — data generation must be
      # run explicitly before it. build:icons generates React icon components
      # from SVGs; build:data parses our markdown into data.json/about.json.
      - name: Generate radar icon components
        run: npm run build:icons
        working-directory: /tmp/aoe_radar
      - name: Generate radar data from markdown
        run: npm run build:data
        working-directory: /tmp/aoe_radar
      - name: Build radar
        run: npm run build
        working-directory: /tmp/aoe_radar

      # ── Combine outputs ────────────────────────────────────────────────────
      # MkDocs outputs to site/ → served at /
      # AOE radar outputs to /tmp/aoe_radar/build/ → served at /radar/
      - name: Copy radar into docs site
        run: cp -r /tmp/aoe_radar/build site/radar

      # ── Deploy to Azure Static Web Apps ───────────────────────────────────
      # Secret: AZURE_STATIC_WEB_APPS_API_TOKEN
      # Retrieve from: Azure portal → Static Web App → Settings → Deployment token
      # Add to: GitHub repo → Settings → Secrets → Actions
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "site"
          skip_app_build: true
